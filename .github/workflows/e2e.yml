name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-flutter'
    name: Linux container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/e2e/linux/e2e.sh

  e2e-windows:
    if: github.repository == 'version-fox/vfox-flutter'
    name: Windows ${{ matrix.vfox }} / ${{ matrix.flavor }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        vfox: [latest, main]
        flavor: [official, ohos]
    env:
      VFOX_VERSION: ${{ matrix.vfox }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v7
      - run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/e2e/windows/e2e.ps1
